name: Deploy to EKS
description: Update a Kubernetes deployment with a new container image

inputs:
  cluster-name:
    description: EKS cluster name
    required: true
  aws-region:
    description: AWS region
    required: true
  namespace:
    description: Kubernetes namespace
    required: true
  deployment-name:
    description: Kubernetes deployment name
    required: true
  container-name:
    description: Container name inside the deployment
    required: true
  image:
    description: Full image reference including tag
    required: true

runs:
  using: composite
  steps:
    - name: Update kubeconfig
      shell: bash
      run: |
        aws eks update-kubeconfig \
          --name "${{ inputs.cluster-name }}" \
          --region "${{ inputs.aws-region }}"

    - name: Roll out image
      shell: bash
      run: |
        kubectl -n "${{ inputs.namespace }}" set image \
          "deployment/${{ inputs.deployment-name }}" \
          "${{ inputs.container-name }}=${{ inputs.image }}"

        kubectl -n "${{ inputs.namespace }}" rollout status \
          "deployment/${{ inputs.deployment-name }}" \
          --timeout=300s
