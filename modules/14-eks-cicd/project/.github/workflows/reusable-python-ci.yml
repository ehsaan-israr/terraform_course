name: Reusable Python CI

on:
  workflow_call:
    inputs:
      service-name:
        description: Service identifier
        required: true
        type: string
      service-path:
        description: Path to the service directory
        required: true
        type: string
      python-version:
        description: Python version
        required: false
        type: string
        default: "3.12"

jobs:
  test:
    name: ${{ inputs.service-name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python service
        uses: ./.github/actions/setup-python-service
        with:
          service-path: ${{ inputs.service-path }}
          python-version: ${{ inputs.python-version }}

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
