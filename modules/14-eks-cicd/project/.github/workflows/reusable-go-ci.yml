name: Reusable Go CI

on:
  workflow_call:
    inputs:
      service-name:
        description: Service identifier
        required: true
        type: string
      service-path:
        description: Path to the service directory
        required: true
        type: string
      go-version:
        description: Go version
        required: false
        type: string
        default: "1.22"

jobs:
  test:
    name: ${{ inputs.service-name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go service
        uses: ./.github/actions/setup-go-service
        with:
          service-path: ${{ inputs.service-path }}
          go-version: ${{ inputs.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1
