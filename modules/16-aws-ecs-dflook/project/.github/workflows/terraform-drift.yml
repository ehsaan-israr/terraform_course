name: terraform-drift

# Drift is a Terraform question: does remote state still match config + AWS?
# git diff against main cannot see console clicks, failed applies, or
# data-source changes.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  check:
    name: terraform check (ecs-dev)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform check
        id: check
        uses: dflook/terraform-check@v2
        with:
          path: terraform
          var_file: terraform/terraform.tfvars.example
          backend_config: |
            bucket=${{ vars.TF_STATE_BUCKET }}
            key=ecs-dflook/dev/terraform.tfstate
            region=${{ env.AWS_REGION }}
            dynamodb_table=${{ vars.TF_LOCK_TABLE }}
            encrypt=true

      - name: Drift detected
        if: ${{ failure() && steps.check.outputs.failure_reason == 'changes-to-apply' }}
        run: |
          echo "Terraform plan is not empty. Investigate console drift or a missed apply."
          exit 1
