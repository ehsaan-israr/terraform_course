name: Reusable Glue Terraform

on:
  workflow_call:
    inputs:
      github_environment:
        description: GitHub environment name (dev, qa, uat, prod) for secrets/vars scope
        required: true
        type: string
      terraform_action:
        description: Run terraform plan only, or plan and apply
        required: false
        type: string
        default: apply
      pr_number:
        description: Pull request number to comment on after plan (plan runs only)
        required: false
        type: string
        default: ""
      aws_region:
        description: AWS region fallback when vars.AWS_REGION is not set
        required: false
        type: string
        default: us-east-1
      force_all_jobs:
        description: Plan/apply all jobs instead of only changed ones
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ROLE_ARN:
        description: IAM role ARN for GitHub OIDC authentication (one secret name per GitHub environment)
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform ${{ inputs.terraform_action }} (${{ inputs.github_environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve diff refs
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
            echo "head_ref=HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "base_ref=HEAD^" >> "$GITHUB_OUTPUT"
            else
              echo "base_ref=$BEFORE" >> "$GITHUB_OUTPUT"
            fi
            echo "head_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch — compare against previous commit unless force_all_jobs
            echo "base_ref=HEAD^" >> "$GITHUB_OUTPUT"
            echo "head_ref=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed Glue jobs
        id: changed
        run: |
          FORCE_ARGS=()
          if [ "${{ inputs.force_all_jobs }}" = "true" ]; then
            FORCE_ARGS+=(--force-all)
          fi
          python gluejobs/scripts/detect-changed-jobs.py \
            --base-ref "${{ steps.refs.outputs.base_ref }}" \
            --head-ref "${{ steps.refs.outputs.head_ref }}" \
            --github-output "$GITHUB_OUTPUT" \
            "${FORCE_ARGS[@]}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || inputs.aws_region }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Generate Terraform job variables
        # Always generate ALL jobs for this stage so Terraform does not destroy unchanged jobs.
        run: python gluejobs/scripts/generate-tfvars.py --stage ${{ vars.env }}

      - name: Resolve Terraform targets
        id: targets
        env:
          CHANGED_JOBS: ${{ steps.changed.outputs.jobs }}
          MODE: ${{ steps.changed.outputs.mode }}
          REASON: ${{ steps.changed.outputs.reason }}
        run: |
          mkdir -p gluejobs/terraform/generated

          if [ "$MODE" = "full" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "targets_file=" >> "$GITHUB_OUTPUT"
            echo "upload_folders_file=gluejobs/terraform/generated/active-job-folders.txt" >> "$GITHUB_OUTPUT"
            echo "Full scope: $REASON"
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          changed = {j for j in os.environ["CHANGED_JOBS"].split(",") if j}
          tfvars = json.loads(Path("gluejobs/terraform/generated/glue-jobs.auto.tfvars.json").read_text())
          jobs = tfvars.get("glue_jobs", {})

          keys = sorted(
              name
              for name, cfg in jobs.items()
              if cfg.get("job_folder") in changed or name in changed
          )
          folders = sorted(
              {
                  cfg.get("job_folder", name)
                  for name, cfg in jobs.items()
                  if name in keys
              }
          )

          generated = Path("gluejobs/terraform/generated")
          out = Path(os.environ["GITHUB_OUTPUT"])

          with out.open("a", encoding="utf-8") as handle:
              if not keys:
                  handle.write("scope=none\n")
                  handle.write("targets_file=\n")
                  handle.write("upload_folders_file=\n")
              else:
                  targets_file = generated / "terraform-targets.txt"
                  targets_file.write_text(
                      "\n".join(f'aws_glue_job.this["{k}"]' for k in keys) + "\n",
                      encoding="utf-8",
                  )
                  upload_file = generated / "upload-job-folders.txt"
                  upload_file.write_text("\n".join(folders) + "\n", encoding="utf-8")
                  handle.write("scope=selective\n")
                  handle.write(f"targets_file={targets_file}\n")
                  handle.write(f"upload_folders_file={upload_file}\n")

          print(f"Changed folders: {sorted(changed)}")
          print(f"Active targets for this stage: {keys}")
          PY

      - name: Skip when changed jobs are inactive in this stage
        if: steps.targets.outputs.scope == 'none'
        run: |
          echo "Changed jobs are skipped or inactive in ${{ vars.env }}; nothing to plan/apply."

      - name: Upload Glue scripts to S3
        if: inputs.terraform_action == 'apply' && steps.targets.outputs.scope != 'none'
        env:
          SCRIPTS_BUCKET: ${{ vars.SCRIPTS_S3_BUCKET }}
          SCRIPTS_PREFIX: ${{ vars.SCRIPTS_S3_PREFIX || 'glue-jobs' }}
          UPLOAD_FILE: ${{ steps.targets.outputs.upload_folders_file }}
        run: |
          if [ ! -f "$UPLOAD_FILE" ]; then
            echo "No jobs to upload for ${{ vars.env }}."
            exit 0
          fi

          while IFS= read -r job_folder || [ -n "$job_folder" ]; do
            [ -z "$job_folder" ] && continue
            job_dir="gluejobs/${job_folder}/"
            if [ -d "${job_dir}scripts" ]; then
              echo "Uploading scripts for ${job_folder}"
              aws s3 sync "${job_dir}scripts/" "s3://${SCRIPTS_BUCKET}/${SCRIPTS_PREFIX}/${job_folder}/" --delete
            else
              echo "No scripts directory for ${job_folder}; skipping upload."
            fi
          done < "$UPLOAD_FILE"

      - name: Set up Terraform
        if: steps.targets.outputs.scope != 'none'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        if: steps.targets.outputs.scope != 'none'
        working-directory: gluejobs/terraform
        run: |
          terraform init -input=false \
            -backend-config="key=glue-jobs/${{ vars.env }}/terraform.tfstate"

      - name: Terraform Plan (apply)
        if: inputs.terraform_action == 'apply' && steps.targets.outputs.scope != 'none'
        working-directory: gluejobs/terraform
        env:
          TARGETS_FILE: ${{ steps.targets.outputs.targets_file }}
        run: |
          TARGET_ARGS=()
          if [ -n "$TARGETS_FILE" ] && [ -f "$TARGETS_FILE" ]; then
            while IFS= read -r target || [ -n "$target" ]; do
              [ -z "$target" ] && continue
              TARGET_ARGS+=(-target="$target")
            done < "$TARGETS_FILE"
            echo "Selective targets: ${TARGET_ARGS[*]}"
          else
            echo "Full plan (all jobs)"
          fi

          terraform plan -input=false \
            -var="environment=${{ vars.env }}" \
            -var="glue_role_arn=${{ vars.GLUE_ROLE_ARN }}" \
            -var="scripts_s3_bucket=${{ vars.SCRIPTS_S3_BUCKET }}" \
            -var="scripts_s3_prefix=${{ vars.SCRIPTS_S3_PREFIX || 'glue-jobs' }}" \
            -var="aws_region=${{ vars.AWS_REGION || inputs.aws_region }}" \
            "${TARGET_ARGS[@]}" \
            -out=tfplan

      - name: Terraform Plan (preview)
        if: inputs.terraform_action == 'plan' && steps.targets.outputs.scope != 'none'
        working-directory: gluejobs/terraform
        env:
          TARGETS_FILE: ${{ steps.targets.outputs.targets_file }}
        run: |
          set -o pipefail
          TARGET_ARGS=()
          if [ -n "$TARGETS_FILE" ] && [ -f "$TARGETS_FILE" ]; then
            while IFS= read -r target || [ -n "$target" ]; do
              [ -z "$target" ] && continue
              TARGET_ARGS+=(-target="$target")
            done < "$TARGETS_FILE"
            echo "Selective targets: ${TARGET_ARGS[*]}"
          else
            echo "Full plan (all jobs)"
          fi

          terraform plan -input=false -no-color \
            -var="environment=${{ vars.env }}" \
            -var="glue_role_arn=${{ vars.GLUE_ROLE_ARN }}" \
            -var="scripts_s3_bucket=${{ vars.SCRIPTS_S3_BUCKET }}" \
            -var="scripts_s3_prefix=${{ vars.SCRIPTS_S3_PREFIX || 'glue-jobs' }}" \
            -var="aws_region=${{ vars.AWS_REGION || inputs.aws_region }}" \
            "${TARGET_ARGS[@]}" \
            | tee plan.txt

      - name: Terraform Apply
        if: inputs.terraform_action == 'apply' && steps.targets.outputs.scope != 'none'
        working-directory: gluejobs/terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Upload plan artifact
        if: inputs.terraform_action == 'plan' && steps.targets.outputs.scope != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ vars.env }}
          path: gluejobs/terraform/plan.txt
          retention-days: 14

      - name: Comment plan on PR
        if: inputs.terraform_action == 'plan' && inputs.pr_number != '' && steps.targets.outputs.scope != 'none'
        uses: actions/github-script@v7
        env:
          PLAN_ENV: ${{ vars.env }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PLAN_SCOPE: ${{ steps.targets.outputs.scope }}
          CHANGED_JOBS: ${{ steps.changed.outputs.jobs }}
          REASON: ${{ steps.changed.outputs.reason }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('gluejobs/terraform/plan.txt', 'utf8');
            const scope = process.env.PLAN_SCOPE;
            const jobs = process.env.CHANGED_JOBS || 'all';
            const reason = process.env.REASON || '';
            const header = scope === 'selective'
              ? `### Terraform Plan (${process.env.PLAN_ENV}) — jobs: \`${jobs}\`\n_${reason}_\n\n`
              : `### Terraform Plan (${process.env.PLAN_ENV}) — all jobs\n_${reason}_\n\n`;
            const body = `${header}\`\`\`\n${plan.slice(-60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
