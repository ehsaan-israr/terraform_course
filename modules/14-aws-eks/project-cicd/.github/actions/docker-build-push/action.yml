name: Docker Build and Push
description: Build a service image and push it to Amazon ECR

inputs:
  service-name:
    description: Logical service name used in image tags
    required: true
  service-path:
    description: Path to the service directory containing the Dockerfile
    required: true
  ecr-registry:
    description: ECR registry host (account.dkr.ecr.region.amazonaws.com)
    required: true
  image-tag:
    description: Image tag to apply
    required: true
  aws-region:
    description: AWS region
    required: true

runs:
  using: composite
  steps:
    - name: Log in to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.service-path }}
        push: true
        tags: |
          ${{ inputs.ecr-registry }}/${{ inputs.service-name }}:${{ inputs.image-tag }}
          ${{ inputs.ecr-registry }}/${{ inputs.service-name }}:latest
        cache-from: type=gha,scope=${{ inputs.service-name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}
