name: Setup Python Service
description: Install Python dependencies and cache pip packages for a monorepo service

inputs:
  service-path:
    description: Path to the Python service directory
    required: true
  python-version:
    description: Python version to use
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          ${{ inputs.service-path }}/requirements.txt
          ${{ inputs.service-path }}/requirements-dev.txt

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.service-path }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
