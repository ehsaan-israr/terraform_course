apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-nginx
  namespace: course-app
  labels:
    app: course-nginx
    component: web
    version: v1
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: course-nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: course-nginx
        component: web
        version: v1
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: nginx
          # Replace ACCOUNT_ID with your AWS account ID after pushing to ECR
          image: 111122223333.dkr.ecr.us-east-1.amazonaws.com/course-nginx:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: course-nginx-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
