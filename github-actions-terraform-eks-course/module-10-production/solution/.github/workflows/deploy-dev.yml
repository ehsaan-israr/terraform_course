name: Deploy Dev

on:
  push:
    branches: [develop]
    paths:
      - "module-10-production/solution/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      environment: dev
      terraform_action: plan
      tfvars_file: module-10-production/solution/config/dev.tfvars
      aws_role_arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}
    secrets: inherit

  apply:
    needs: plan
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      environment: dev
      terraform_action: apply
      tfvars_file: module-10-production/solution/config/dev.tfvars
      aws_role_arn: ${{ secrets.AWS_APPLY_ROLE_ARN }}
    secrets: inherit

  docker:
    needs: apply
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      environment: dev
      ecr_repository: gha-terraform-eks-dev-sample-app
      aws_role_arn: ${{ secrets.ECR_PUSH_ROLE_ARN }}
    secrets: inherit
