apiVersion: v1
kind: Namespace
metadata:
  name: capstone-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-api
  namespace: capstone-app
  labels:
    app: capstone-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: capstone-api
  template:
    metadata:
      labels:
        app: capstone-api
    spec:
      containers:
        - name: api
          image: capstone-api:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: ENVIRONMENT
              value: dev
            - name: VERSION
              value: latest
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-api
  namespace: capstone-app
  labels:
    app: capstone-api
spec:
  selector:
    app: capstone-api
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 3000
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: capstone-api
  namespace: capstone-app
  labels:
    app: capstone-api
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: capstone-api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
