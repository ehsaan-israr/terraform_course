apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: default
  labels:
    app: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          ports:
            - name: http
              containerPort: 80
            - name: metrics
              containerPort: 9113
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.0.0
          args:
            - "-nginx.scrape-uri=http://localhost/stub_status"
          ports:
            - name: metrics
              containerPort: 9113
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: default
  labels:
    app: sample-app
spec:
  selector:
    app: sample-app
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9113
      targetPort: metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-stub-status
  namespace: default
data:
  stub_status.conf: |
    server {
      listen 80;
      location /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
      }
      location / {
        root /usr/share/nginx/html;
      }
    }
