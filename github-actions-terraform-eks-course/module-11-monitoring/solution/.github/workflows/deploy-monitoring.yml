name: Deploy Monitoring

on:
  push:
    branches: [main]
    paths:
      - "module-11-monitoring/solution/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: gha-terraform-eks-dev
  HELM_CHART_VERSION: "55.5.0"

jobs:
  deploy:
    name: Deploy Observability Stack
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EKS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.4"

      - name: Add Helm repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Apply namespaces and app
        run: |
          kubectl apply -f module-11-monitoring/solution/kubernetes/namespace-monitoring.yaml
          kubectl apply -f module-11-monitoring/solution/kubernetes/sample-app-metrics.yaml
          kubectl apply -f module-11-monitoring/solution/kubernetes/servicemonitor-sample-app.yaml

      - name: Install kube-prometheus-stack
        run: |
          helm upgrade --install kube-prometheus-stack \
            prometheus-community/kube-prometheus-stack \
            --version ${{ env.HELM_CHART_VERSION }} \
            --namespace monitoring \
            --create-namespace \
            -f module-11-monitoring/solution/helm/kube-prometheus-stack-values.yaml \
            --wait --timeout 10m

      - name: Deploy Fluent Bit
        run: |
          kubectl apply -f module-11-monitoring/solution/kubernetes/fluent-bit/

      - name: Deploy Kubernetes Dashboard
        run: |
          kubectl apply -f module-11-monitoring/solution/kubernetes/kubernetes-dashboard.yaml

      - name: Verify monitoring pods
        run: |
          kubectl get pods -n monitoring
          kubectl get servicemonitor -n monitoring
