name: CD — Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: ECR image tag to deploy (default = commit SHA)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "module-08-cd/**"
      - "k8s/**"
      - ".github/workflows/cd.yml"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: course-api
  K8S_NAMESPACE: course-app
  DEPLOYMENT_NAME: course-api
  CONTAINER_NAME: course-api

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA}"
          fi
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Deploying image: ${IMAGE}"

      - name: Update kubeconfig
        env:
          CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}"

      - name: Apply namespace and config
        run: |
          kubectl apply -f module-08-cd/solution/k8s/namespace.yaml
          kubectl apply -f module-08-cd/solution/k8s/configmap.yaml
          kubectl apply -f module-08-cd/solution/k8s/service.yaml

      - name: Deploy Deployment manifest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|g" \
            module-08-cd/solution/k8s/deployment.yaml \
            | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${DEPLOYMENT_NAME} \
            -n ${K8S_NAMESPACE} \
            --timeout=300s

      - name: Verify deployed image
        run: |
          kubectl get deployment ${DEPLOYMENT_NAME} -n ${K8S_NAMESPACE} -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo ""
          kubectl get pods -n ${K8S_NAMESPACE} -l app=course-api

      - name: Smoke test (in-cluster curl via kubectl run)
        run: |
          kubectl run curl-smoke \
            --rm -i --restart=Never \
            --image=curlimages/curl:8.11.1 \
            -n ${K8S_NAMESPACE} \
            --command -- \
            curl -sf "http://course-api.${K8S_NAMESPACE}.svc.cluster.local/health"
