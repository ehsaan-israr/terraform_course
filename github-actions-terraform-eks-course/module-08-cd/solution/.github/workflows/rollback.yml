name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Revision number to roll back to (leave empty for previous)
        required: false
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: course-app
  DEPLOYMENT_NAME: course-api

jobs:
  rollback:
    name: Rollback on EKS
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}

      - name: Update kubeconfig
        env:
          CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}"

      - name: Show rollout history
        run: |
          kubectl rollout history deployment/${DEPLOYMENT_NAME} -n ${K8S_NAMESPACE}

      - name: Roll back deployment
        env:
          REVISION: ${{ github.event.inputs.revision }}
        run: |
          if [ -n "$REVISION" ]; then
            kubectl rollout undo deployment/${DEPLOYMENT_NAME} \
              -n ${K8S_NAMESPACE} \
              --to-revision="${REVISION}"
          else
            kubectl rollout undo deployment/${DEPLOYMENT_NAME} \
              -n ${K8S_NAMESPACE}
          fi

      - name: Wait for rollback rollout
        run: |
          kubectl rollout status deployment/${DEPLOYMENT_NAME} \
            -n ${K8S_NAMESPACE} \
            --timeout=300s

      - name: Verify pods
        run: |
          kubectl get pods -n ${K8S_NAMESPACE} -l app=course-api -o wide
          kubectl get deployment ${DEPLOYMENT_NAME} -n ${K8S_NAMESPACE} \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo ""
